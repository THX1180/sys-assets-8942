name: Update Wallpapers JSON

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate wallpapers.json from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              f"https://github.com{repo}/releases",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          )
          releases = json.loads(urllib.request.urlopen(req).read().decode())

          wallpapers = []
          for rel in releases:
              if rel.get("draft"):
                  continue
              tag_title = rel.get("name") or rel.get("tag_name") or "Collectie"
              for asset in rel.get("assets", []):
                  name = asset["name"]
                  if name.lower().endswith((".mp4", ".mkv", ".webm")):
                      clean_title = name.rsplit(".", 1)[0].replace(".", " ").replace("_", " ").title()
                      url = asset["browser_download_url"]
                      wallpapers.append({
                          "title": clean_title,
                          "location": tag_title,
                          "url_1080p": url,
                          "url_4k": url
                      })

          with open("wallpapers.json", "w", encoding="utf-8") as f:
              json.dump(wallpapers, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit and push wallpapers.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add wallpapers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update wallpapers.json" && git push)
